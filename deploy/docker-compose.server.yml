# Дополнение для сервера: HTTPS через Caddy перед frontend.
# Запуск: docker compose -f docker-compose.yml -f deploy/docker-compose.server.yml up -d --build
# Порты frontend и backend в .env привязаны к 127.0.0.1, снаружи открыты только 80 и 443.
services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Задайте SITE_DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
