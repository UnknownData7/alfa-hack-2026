server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: credit-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit}
    username: ${DB_USER:credit}
    password: ${DB_PASSWORD:credit}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Схемой управляет Flyway
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  pricing:
    key-rate-percent: ${KEY_RATE_PERCENT:15.0}
  pipeline:
    step-delay-ms: ${PIPELINE_STEP_DELAY_MS:800}
  mocks:
    latency-ms: ${MOCK_LATENCY_MS:200}
    # Имитация сбоя внешних источников: REGISTRY, BUREAU, TAX через запятую
    unavailable-sources: ${MOCK_UNAVAILABLE_SOURCES:}
  tasks:
    sla-hours: ${TASK_SLA_HOURS:4}
  uploads:
    dir: ${UPLOAD_DIR:./data/uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    show-signing-code: ${DEMO_SHOW_SIGNING_CODE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # Идентификатор корреляции попадает в каждую строку лога
    level: "%5p [%X{traceId:-}]"
